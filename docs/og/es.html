<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Unbounded";
        src: url("../node_modules/@fontsource-variable/unbounded/files/unbounded-latin-wght-normal.woff2") format("woff2");
        font-weight: 200 900;
      }
      @font-face {
        font-family: "Inter";
        src: url("../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2") format("woff2");
        font-weight: 100 900;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2") format("woff2");
        font-weight: 100 800;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0b0a08;
        color: #f3ede1;
        font-family: "Inter", sans-serif;
        position: relative;
      }

      .bloom {
        position: absolute;
        width: 760px;
        height: 760px;
        right: -180px;
        bottom: -300px;
        border-radius: 50%;
        background: radial-gradient(circle, rgb(200 180 135 / 0.16), transparent 68%);
      }

      .ring {
        position: absolute;
        right: 40px;
        top: 96px;
        width: 380px;
        height: 380px;
        border-radius: 50%;
        border: 1px solid rgb(200 180 135 / 0.18);
      }

      .frame {
        position: relative;
        height: 100%;
        padding: 68px 72px;
        display: flex;
        flex-direction: column;
      }

      .brand { display: flex; align-items: center; gap: 12px; }
      .brand span {
        font-family: "Unbounded", sans-serif;
        font-weight: 700;
        font-size: 30px;
        letter-spacing: -0.04em;
      }

      .eyebrow {
        margin-top: 74px;
        font-family: "JetBrains Mono", monospace;
        font-size: 15px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #9a9083;
      }

      h1 {
        margin-top: 22px;
        font-family: "Unbounded", sans-serif;
        font-weight: 600;
        font-size: 82px;
        line-height: 1.04;
        letter-spacing: -0.03em;
      }

      .grad {
        background: linear-gradient(115deg, #e0c98f 0%, #c8b487 48%, #a8895c 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .lead {
        margin-top: 30px;
        font-size: 24px;
        color: #9a9083;
        max-width: 620px;
      }
    </style>
  </head>
  <body>
    <div class="bloom"></div>
    <div class="ring"></div>
    <div class="frame">
      <div class="brand">
        <svg viewBox="0 0 64 64" width="34" height="34">
          <defs>
            <linearGradient id="g" x1="12" y1="8" x2="52" y2="56" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#c8b487" />
              <stop offset="1" stop-color="#e0c98f" />
            </linearGradient>
          </defs>
          <path d="M44 18.5A12 12 0 1 0 32 32a12 12 0 1 1-12 13.5" fill="none" stroke="url(#g)" stroke-width="9" stroke-linecap="round" />
          <path d="M54 2.5l2.2 5.3L61.5 10l-5.3 2.2L54 17.5l-2.2-5.3L46.5 10l5.3-2.2Z" fill="#e0c98f" />
        </svg>
        <span>sbravo</span>
      </div>

      <p class="eyebrow">Hub de software gratis</p>

      <h1>
        Herramientas<br />
        que se sienten<br />
        <span class="grad">como magia.</span>
      </h1>

      <p class="lead">Apps livianas, changelogs honestos y cero relleno.</p>
    </div>
  </body>
</html>
